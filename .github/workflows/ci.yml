name: continuous-integration
on:
  push:
    branches:
      - master
      - release/*
  pull_request:

jobs:
  code-analysis:
    name: Code Analysis (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5', '8.6']
        cs-fixer: [ true ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP and Install Composer Dependencies
        uses: ./.github/actions/build
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Code Analysis (PHP CS-Fixer)
        if: matrix.cs-fixer == true
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --allow-unsupported-php-version=yes
      - name: Code Analysis (PHPStan)
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5', '8.6']
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: baikal_test
          MYSQL_USER: baikal
          MYSQL_PASSWORD: baikal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baikal_test
          POSTGRES_USER: baikal
          POSTGRES_PASSWORD: baikal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baikal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP and Install Composer Dependencies
        uses: ./.github/actions/build
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Setup Python
        run: |
          pip install mechanicalsoup mysql-connector-python psycopg2 --break-system-packages
      - name: Start PHP server (checkout)
        run: php -S 0.0.0.0:8000 -t . > php_server.log 2>&1 &
      - name: Run tests (checkout)
        env:
          BAIKAL_BASE_URL: http://localhost:8000/html/
          BAIKAL_ROOT_DIR: .
        run: python run_tests.py
      - name: Build dist zip
        run: |
          make dist
          unzip build/baikal-*.zip -d build/extracted
      - name: Start PHP server (dist)
        run: php -S 0.0.0.0:8001 -t build/extracted/baikal > php_server_dist.log 2>&1 &
      - name: Run tests (dist)
        env:
          BAIKAL_BASE_URL: http://localhost:8001/html/
          BAIKAL_ROOT_DIR: build/extracted/baikal
        run: python run_tests.py
      - name: Print server logs
        if: always()
        run: cat php_server.log php_server_dist.log
